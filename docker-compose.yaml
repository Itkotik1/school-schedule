services:
  db:
    image: postgres:16-alpine
    container_name: school_schedule_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_schedule
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: 2510
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_schedule"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: school_schedule_web
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: